<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 184" role="img" aria-labelledby="title description">
  <title id="title">Shivraj Cab</title>
  <desc id="description">Shivraj Cab — Reliable, Safe, Travel. Nashik, established 2010.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f70" />
      <stop offset=".55" stop-color="#09284d" />
      <stop offset="1" stop-color="#061a33" />
    </linearGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36e" />
      <stop offset=".52" stop-color="#f6a51c" />
      <stop offset="1" stop-color="#db6d0b" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f5ff" />
      <stop offset="1" stop-color="#73a6ca" />
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dy="3" />
      <feComponentTransfer><feFuncA type="linear" slope=".25" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Distinctive shield: a fort gate, rising route and touring cab -->
  <g filter="url(#shadow)">
    <path d="M96 5 174 34v57c0 43-31 72-78 88-47-16-78-45-78-88V34z" fill="url(#shield)" stroke="url(#saffron)" stroke-width="5" />
    <path d="M96 14 165 40v51c0 37-25 63-69 79-44-16-69-42-69-79V40z" fill="none" stroke="#fff0c9" stroke-opacity=".28" stroke-width="1.5" />
    <path d="M39 69V54h13V43h15v12h13V37h16v10h16V36h16v19h13V45h14v24" fill="none" stroke="url(#saffron)" stroke-width="4" stroke-linecap="square" stroke-linejoin="round" />
    <path d="M48 71h96M84 71v13m24-13v13m-37 0h50" fill="none" stroke="#dceaf5" stroke-opacity=".75" stroke-width="2" />
    <path d="M45 116c24-27 61-14 60-37-1-13 13-21 31-28" fill="none" stroke="#f6a51c" stroke-opacity=".35" stroke-width="13" stroke-linecap="round" />
    <path d="M45 116c24-27 61-14 60-37-1-13 13-21 31-28" fill="none" stroke="url(#saffron)" stroke-width="8" stroke-linecap="round" />
    <path d="m126 49 14-9 2 16" fill="none" stroke="#ffe7ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M43 125h106" stroke="#dceaf5" stroke-opacity=".64" stroke-width="2" stroke-dasharray="5 5" />

    <!-- Side-profile cab with bright glass and two metallic wheels -->
    <path d="M42 116h14l13-18c3-4 7-6 13-6h29c6 0 10 2 14 7l12 15 10 3c4 1 7 5 7 9v8H37v-9c0-5 2-8 5-9z" fill="#eef4f7" stroke="#0a1d35" stroke-width="3" />
    <path d="m74 99-10 16h28V96H80c-3 0-5 1-6 3zm23-3v19h32l-10-13c-2-4-5-6-10-6z" fill="url(#glass)" stroke="#b6c8d3" stroke-width="1.5" />
    <path d="M38 118h18m82 0h17" stroke="url(#saffron)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M43 126h9m105 0h9" stroke="#f8bb42" stroke-width="4" stroke-linecap="round" />
    <circle cx="64" cy="134" r="9" fill="#071a32" stroke="#d7e0e8" stroke-width="3" />
    <circle cx="143" cy="134" r="9" fill="#071a32" stroke="#d7e0e8" stroke-width="3" />
    <circle cx="64" cy="134" r="2.7" fill="#f3b13b" />
    <circle cx="143" cy="134" r="2.7" fill="#f3b13b" />
  </g>

  <!-- Custom wordmark with a separate saffron cab tab -->
  <text x="220" y="51" fill="#9a6725" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="4">NASHIK  ·  EST. 2010</text>
  <text x="216" y="112" fill="#061d3a" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="60" font-weight="900" letter-spacing="-2.4">SHIVRAJ</text>
  <path d="M504 62h153a7 7 0 0 1 7 7v43h-160z" fill="url(#saffron)" />
  <path d="M511 69h139v36H511z" fill="none" stroke="#fff1c8" stroke-opacity=".6" stroke-width="1.5" />
  <text x="580" y="101" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="38" font-weight="900" letter-spacing="1">CAB</text>
  <path d="M220 126h439" stroke="#122c4a" stroke-width="2" />
  <path d="M220 126h118" stroke="url(#saffron)" stroke-width="4" />
  <text x="221" y="153" fill="#244461" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="2.7">RELIABLE  ·  SAFE  ·  TRAVEL</text>
</svg>
