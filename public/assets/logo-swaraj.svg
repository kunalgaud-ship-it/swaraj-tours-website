<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Swaraj Cab</title>
  <desc id="logo-description">Swaraj Cab, 24/7 cab service in Nashik.</desc>
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="checker" width="16" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0f172a"/>
      <rect x="8" width="8" height="8" fill="#f59e0b"/>
    </pattern>
  </defs>

  <!-- Mark: navy coin, amber S road with route markers -->
  <g transform="translate(10 10) scale(1.2)">
    <circle cx="50" cy="50" r="48" fill="url(#coin)"/>
    <circle cx="50" cy="50" r="42.5" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5"/>
    <path d="M66 27H42a11 11 0 0 0 0 22h16a11 11 0 0 1 0 22H34" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round"/>
    <path d="M66 27H42a11 11 0 0 0 0 22h16a11 11 0 0 1 0 22H34" fill="none" stroke="#0b1a2e" stroke-opacity=".75" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4.5 5"/>
    <circle cx="66" cy="27" r="6" fill="#ffffff"/><circle cx="66" cy="27" r="2.4" fill="#0b1a2e"/>
    <circle cx="34" cy="71" r="6" fill="#ffffff"/><circle cx="34" cy="71" r="2.4" fill="#0b1a2e"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="76" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-0.5" fill="#0f172a">SWARAJ<tspan dx="14" fill="#f59e0b">CAB</tspan></text>
  <rect x="152" y="88" width="350" height="6" rx="1.5" fill="url(#checker)"/>
  <text x="153" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#64748b">NASHIK  ·  24/7 CAB SERVICE</text>
</svg>
