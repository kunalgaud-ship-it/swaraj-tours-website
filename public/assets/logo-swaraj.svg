<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Swaraj Tours and Travels</title>
  <desc id="logo-description">Swaraj Tours and Travels cab service in Nashik.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183b5c"/>
      <stop offset="1" stop-color="#0c2035"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6cf7b"/>
      <stop offset="1" stop-color="#d99a35"/>
    </linearGradient>
  </defs>

  <!-- Journey mark: sunrise, winding road and a cab inside a clean badge. -->
  <rect x="8" y="8" width="144" height="144" rx="34" fill="url(#badge)"/>
  <rect x="14" y="14" width="132" height="132" rx="29" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
  <circle cx="105" cy="45" r="23" fill="url(#gold)"/>
  <path d="M27 91 52 69l18 15 19-25 34 32v16H27z" fill="#315571"/>
  <path d="M27 120c18-15 34-9 47-22 10-10 13-22 13-34" fill="none" stroke="#f8f6ef" stroke-width="18" stroke-linecap="round"/>
  <path d="M27 120c18-15 34-9 47-22 10-10 13-22 13-34" fill="none" stroke="#d99a35" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 8"/>
  <path d="M36 92 45 76c2-4 5-6 10-6h27c5 0 9 2 11 7l9 16 6 3c3 1 4 4 4 7v6H30v-6c0-4 2-7 6-8z" fill="url(#gold)" stroke="#102b46" stroke-width="2"/>
  <path d="m50 77-5 13h18V75h-8c-2 0-4 1-5 2zm20-2v15h27l-7-12c-1-2-3-3-6-3z" fill="#163652"/>
  <circle cx="48" cy="108" r="7" fill="#10243a" stroke="#f4c66c" stroke-width="3"/>
  <circle cx="96" cy="108" r="7" fill="#10243a" stroke="#f4c66c" stroke-width="3"/>
  <rect x="64" y="61" width="20" height="7" rx="2.5" fill="#f7d48a"/>

  <!-- Wordmark -->
  <text x="178" y="72" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="59" font-weight="900" letter-spacing="1.2" fill="#102b46">SWARAJ</text>
  <text x="182" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="4.5" fill="#c48a22">TOURS &amp; TRAVELS</text>
  <path d="M182 121h305" stroke="#e8b867" stroke-width="2.5" stroke-linecap="round"/>
  <text x="182" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.1" fill="#53677b">NASHIK  &#8226;  MAHARASHTRA  &#8226;  24/7 CAB SERVICE</text>
